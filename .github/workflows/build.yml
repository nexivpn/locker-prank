name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fix Gradle structure
        run: |
          # Создаем файл настроек, чтобы Gradle нашел плагин
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositories { google(); mavenCentral() } }" >> settings.gradle
          echo "rootProject.name = \"locker\"" >> settings.gradle
          echo "include ':app'" >> settings.gradle
          
          # Пересоздаем build.gradle в корне
          echo "buildscript { dependencies { classpath 'com.android.tools.build:gradle:8.2.0' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
      - name: Build
        run: gradle wrapper && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: locker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
